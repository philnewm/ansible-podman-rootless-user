---

- name: Ensure required podman packages are installed
  become: true
  ansible.builtin.package:
    name: "{{ podman_packages }}"
    state: present
    update_cache: true

- name: Ensure container user exists
  become: true
  ansible.builtin.user:
    name: "{{ podman_rootless_user }}"
    comment: "Container service account"
    home: "{{ podman_rootless_user_home }}"
    create_home: true
    system: "{{ system_user }}"
    shell: /bin/bash
    state: present
  register: user_result

- name: Enable lingering for rootless user
  become: true
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ podman_rootless_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ podman_rootless_user }}"
  register: lingering_result

- name: Add service user to systemd-journal group
  become: true
  ansible.builtin.user:
    name: "{{ podman_rootless_user }}"
    groups: "systemd-journal"
    append: true

- name: Install dbus packages
  become: true
  ansible.builtin.package:
    name: "{{ podman_rootless_user_dbus_packages }}"
    state: present
    update_cache: true

- name: Set up debian user session
  when: ansible_facts.distribution | lower == "debian"
  block:
    - name: Ensure dbus-user-session installed
      become: true
      ansible.builtin.package:
        name: dbus-user-session
        state: present

    - name: Start user session
      become: true
      ansible.builtin.command:
        cmd: "machinectl shell {{ podman_rootless_user }}@ /bin/true"
        creates: "/run/user/{{ user_result.uid }}/systemd"

    - name: Start user dbus session
      become: true
      become_user: "{{ podman_rootless_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ user_result.uid }}"
      ansible.builtin.command:
        cmd: "systemctl --user start dbus.service"  # noqa: command-instead-of-module
        creates: "/run/user/{{ user_result.uid }}/bus"

- name: Configure subordinate id ranges
  loop:
    - uid
    - gid
  loop_control:
    loop_var: subid_type
  ansible.builtin.include_tasks:
    file: allocate_subid.yml

...
