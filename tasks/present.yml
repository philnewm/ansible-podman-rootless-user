---

- name: Ensure container user exists
  become: true
  ansible.builtin.user:
    name: "{{ rootless_user }}"
    comment: "Container service account"
    home: "{{ rootless_user_home }}"
    create_home: true
    system: "{{ system_user }}"
    shell: /bin/bash
    state: present
  register: user_result

- name: Enable lingering for rootless user
  become: true
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ rootless_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ rootless_user }}"
  register: lingering_result

- name: Add service user to systemd-journal group
  become: true
  ansible.builtin.user:
    name: "{{ rootless_user }}"
    groups: "systemd-journal"
    append: true

- name: Install dbus packages
  become: true
  ansible.builtin.package:
    name: "{{ rootless_user_dbus_packages }}"
    state: present
    update_cache: true

- name: Set up debian user session
  when: ansible_facts.distribution | lower == "debian"
  block:
    - name: Ensure dbus-user-session installed
      become: true
      ansible.builtin.package:
        name: dbus-user-session
        state: present

    - name: Start user session
      become: true
      ansible.builtin.command:
        cmd: "machinectl shell {{ rootless_user }}@ /bin/true"
        creates: "/run/user/{{ user_result.uid }}/systemd"

    - name: Start user dbus session
      become: true
      become_user: "{{ rootless_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ user_result.uid }}"
      ansible.builtin.command:
        cmd: "systemctl --user start dbus.service"  # noqa: command-instead-of-module
        creates: "/run/user/{{ user_result.uid }}/bus"

- name: Set up subids for system user
  when: system_user
  block:
    - name: Get subuid user entry
      ansible.builtin.command:
        cmd: |
          grep -q '^{{ rootless_user }}:' /etc/subuid
      register: subuid_result
      changed_when: false
      failed_when: subuid_result.rc not in [0, 1]

    - name: Get subgid user entry
      ansible.builtin.command:
        cmd: |
          grep -q '^{{ rootless_user }}:' /etc/subgid
      register: subgid_result
      changed_when: false
      failed_when: subgid_result.rc not in [0, 1]

    - name: Initialize subid list
      ansible.builtin.set_fact:
        subids: >-
          {{
            ([ 'subuid' ] if subuid_result.rc == 1 else [])
            + ([ 'subgid' ] if subgid_result.rc == 1 else [])
          }}

    - name: Include subid config
      loop: "{{ subids }}"
      loop_control:
        loop_var: subid_type
      ansible.builtin.include_tasks:
        file: subid_config.yml

...
