---

- name: Migrate rootless podman namespace
  become: true
  become_user: "{{ podman_rootless_user }}"
  vars:
    # Override ansible_become_user from inventory / Foreman
    ansible_become_user: "{{ podman_rootless_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ user_result.uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ user_result.uid }}/bus"
  block:
    - name: Stop rootless Podman socket
      loop:
        - podman.socket
        - podman.service
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        scope: user

    - name: Migrate rootless Podman namespace
      when: ansible_facts.virtualization_type not in ["docker", "podman", "lxc", "containerd", "container"]
      ansible.builtin.command:
        cmd: podman system migrate
      register: podman_migrate
      changed_when: true

  always:
    - name: Start rootless Podman socket
      become: true
      become_user: "{{ podman_rootless_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ user_result.uid }}"
      ansible.builtin.systemd_service:
        name: podman.socket
        state: started
        scope: user

...
