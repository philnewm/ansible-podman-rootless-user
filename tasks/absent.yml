---

- name: Disable lingering for rootless user
  become: true
  ansible.builtin.command:
    cmd: "loginctl disable-linger {{ podman_rootless_user }}"
  args:
    removes: "/var/lib/systemd/linger/{{ podman_rootless_user }}"

- name: "Ensure subid removal of user {{ podman_rootless_user }}"
  become: true
  loop:
    - subuid
    - subgid
  ansible.builtin.lineinfile:
    path: "/etc/{{ item }}"
    regexp: ".*{{ podman_rootless_user }}.*"
    state: absent

- name: Ensure container user is removed
  become: true
  ansible.builtin.user:
    name: "{{ podman_rootless_user }}"
    comment: "Container service account"
    home: "{{ podman_rootless_user_home }}"
    create_home: true
    system: "{{ system_user }}"
    shell: /bin/bash
    state: absent

...
